name: Backend CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: utuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
